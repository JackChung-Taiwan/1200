name: Deploy English 1200 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check site content
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/data.js
          test -d dist/original/English1200-0514
          echo "Original MP3 count: $(find dist/original/English1200-0514 -iname '*.mp3' | wc -l)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
